<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Compteur 24 heures</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f2f7;
    color: #111;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 16px 24px;
  }
  h1 { font-size: 24px; margin: 4px 0 6px; }
  .subtitle { color: #666; margin: 0 0 16px; font-size: 14px; }
  .card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .header, .row {
    display: grid;
    grid-template-columns: 1fr 80px;
    align-items: center;
  }
  .header {
    padding: 10px 18px;
    background: #e5e5ea;
    color: #555;
    font-size: 13px;
    font-weight: 600;
  }
  .row {
    min-height: 54px;
    padding: 0 18px;
    border-top: 1px solid #eee;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .row:active { background: #f5f5f5; }
  .hour { font-size: 18px; }
  .check {
    width: 30px;
    height: 30px;
    justify-self: center;
    accent-color: #007aff;
  }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding: 16px 18px;
    background: white;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 600;
  }
  #count { font-size: 28px; color: #007aff; }
  button {
    width: 100%;
    margin-top: 12px;
    min-height: 48px;
    border: 0;
    border-radius: 14px;
    background: #e5e5ea;
    font-size: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>
<main class="app">
  <h1>Compteur 24 heures</h1>
  <p class="subtitle">Touchez une heure pour l’activer ou la désactiver.</p>

  <section class="card">
    <div class="header"><div>Heure</div><div style="text-align:center">Activé</div></div>
    <div id="hours"></div>
  </section>

  <div class="total">
    <span>Total activé</span>
    <span id="count">0</span>
  </div>

  <button id="reset" type="button">Réinitialiser</button>
</main>

<script>
const container = document.getElementById("hours");
const count = document.getElementById("count");
const reset = document.getElementById("reset");
const storageKey = "compteur24h";

let state = JSON.parse(localStorage.getItem(storageKey) || "[]");
if (!Array.isArray(state) || state.length !== 24) state = Array(24).fill(false);

function save() {
  localStorage.setItem(storageKey, JSON.stringify(state));
}

function updateCount() {
  count.textContent = state.filter(Boolean).length;
}

for (let h = 0; h < 24; h++) {
  const row = document.createElement("label");
  row.className = "row";

  const hour = document.createElement("span");
  hour.className = "hour";
  hour.textContent = `${h}h`;

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.className = "check";
  checkbox.checked = !!state[h];
  checkbox.setAttribute("aria-label", `Activer ${h} heures`);

  checkbox.addEventListener("change", () => {
    state[h] = checkbox.checked;
    save();
    updateCount();
  });

  row.append(hour, checkbox);
  container.appendChild(row);
}

reset.addEventListener("click", () => {
  state = Array(24).fill(false);
  document.querySelectorAll(".check").forEach(c => c.checked = false);
  save();
  updateCount();
});

updateCount();
</script>
</body>
</html>
